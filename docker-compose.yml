services:
  postgres:
    image: postgres:16-alpine
    container_name: t0-d0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: t0_d0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t0_d0"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
