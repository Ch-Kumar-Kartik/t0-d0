<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | FastAPI to-do</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <input class="theme-toggle" id="theme-toggle" type="checkbox" aria-label="Toggle dark mode">
    <div class="page-shell">
      <header class="navbar">
        <a class="brand" href="/"><span class="brand-mark">✓</span><span>FastAPI to-do</span></a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="/">Home</a>
          <a href="/login">Login</a>
          <label class="theme-switch" for="theme-toggle" title="Switch theme"><span class="sun">☀</span><span class="switch-track"><span class="switch-thumb"></span></span><span class="moon">☾</span><span class="sr-only">Toggle dark mode</span></label>
        </nav>
      </header>

      <main class="auth-main">
        <section class="auth-card" aria-labelledby="register-title">
          <p class="eyebrow">Get started</p>
          <h1 id="register-title">Create your account</h1>
          <p class="subtitle">Organize your tasks in one calm place.</p>

          <form id="register-form" class="auth-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" minlength="1" maxlength="50" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <p id="form-feedback" class="form-feedback" role="alert" aria-live="polite"></p>
            <button class="auth-submit" type="submit">Create account</button>
          </form>

          <p class="auth-alternate">Already have an account? <a href="/login">Log in</a></p>
        </section>
      </main>
    </div>

    <script type="module">
      import { register } from "/static/js/auth.js";

      const form = document.getElementById("register-form");
      const feedback = document.getElementById("form-feedback");
      const submitButton = form.querySelector("button[type=submit]");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        feedback.textContent = "";

        if (form.password.value !== form["confirm-password"].value) {
          feedback.textContent = "Passwords do not match.";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Creating account...";

        try {
          await register({
            username: form.username.value,
            email: form.email.value,
            password: form.password.value,
          });
          window.location.assign("/login");
        } catch (error) {
          feedback.textContent = error.message;
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Create account";
        }
      });
    </script>
  </body>
</html>
