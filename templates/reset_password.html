<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password | FastAPI to-do</title>
    <link rel="stylesheet" href="/static/css/styles.css?v=3">
  </head>
  <body>
    <input class="theme-toggle" id="theme-toggle" type="checkbox" aria-label="Toggle dark mode">
    <div class="page-shell">
      <header class="navbar">
        <a class="brand" href="/"><span class="brand-mark">✓</span><span>FastAPI to-do</span></a>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="/login">Log in</a>
          <a class="register-link" href="/register">Register</a>
          <label class="theme-switch" for="theme-toggle" title="Switch theme"><span class="sun">☀</span><span class="switch-track"><span class="switch-thumb"></span></span><span class="moon">☾</span><span class="sr-only">Toggle dark mode</span></label>
        </nav>
      </header>

      <main class="auth-main">
        <section class="auth-card" aria-labelledby="reset-password-title">
          <p class="eyebrow">Password reset</p>
          <h1 id="reset-password-title">Choose a new password</h1>
          <p class="subtitle">Use a password with at least eight characters.</p>

          <form id="reset-password-form" class="auth-form">
            <label for="new-password">New password</label>
            <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>

            <p id="form-feedback" class="form-feedback" role="status" aria-live="polite"></p>
            <button class="auth-submit" type="submit">Save new password</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/static/js/password-reset.js"></script>
  </body>
</html>
